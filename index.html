<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Primary SEO -->
    <title>Veralis — VEX Robotics Scouting App</title>
    <meta
      name="description"
      content="Veralis is a free, offline-first scouting app for VEX Robotics teams. Share robot scouting reports with your team in real time, look up any team's record, skills, OpenSkill rating and awards, and get a live match-queue countdown at events."
    />
    <link rel="canonical" href="https://veralis.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veralis" />
    <meta property="og:title" content="Veralis — VEX Robotics Scouting App" />
    <meta
      property="og:description"
      content="Free, offline-first VEX Robotics scouting. Share reports with your team in real time, look up any team's stats and OpenSkill rating, and get a live match-queue countdown."
    />
    <meta property="og:url" content="https://veralis.app/" />
    <meta property="og:image" content="https://veralis.app/logo-mark.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Veralis — VEX Robotics Scouting App" />
    <meta
      name="twitter:description"
      content="Free, offline-first VEX Robotics scouting. Share reports with your team in real time, look up any team's stats and OpenSkill rating, and get a live match-queue countdown."
    />
    <meta name="twitter:image" content="https://veralis.app/logo-mark.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Veralis",
        "url": "https://veralis.app/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "description": "A free, offline-first scouting app for VEX Robotics teams. Share robot scouting reports in real time, look up any team's record, skills, OpenSkill rating and awards, and get a live match-queue countdown at events.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
